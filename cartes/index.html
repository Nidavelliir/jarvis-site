<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --panel:#18213f; --panel2:#1f2a4f; --line:#2b3863;
  --txt:#eef2ff; --mut:#9aa6c9; --red:#e3350d; --red2:#ff5a36; --gold:#f5c84c; --gold2:#ffe79a;
  --blue:#2a75bb; --ok:#3ecf8e;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 110% -10%, rgba(227,53,13,.22), transparent 60%),
  radial-gradient(800px 500px at -20% 10%, rgba(42,117,187,.25), transparent 60%),
  var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt)}
h1,h2,h3{font-family:"Exo 2",Inter,sans-serif;margin:0;letter-spacing:.2px}
#app{padding:var(--st) var(--sr) calc(var(--sb) + 110px) var(--sl);max-width:900px;margin:0 auto}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 12px) 16px 12px;
  background:linear-gradient(180deg,rgba(11,16,32,.96),rgba(11,16,32,.85));backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05)}
.top h1{font-size:20px;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.top h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-ball{width:20px;height:28px;border-radius:4px;flex:none;transform:rotate(-8deg);
  background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--red));box-shadow:0 0 0 2px rgba(255,255,255,.15),0 4px 10px rgba(227,53,13,.4)}
.applogo{width:30px;height:30px;border-radius:9px;flex:none;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 4px 10px rgba(33,150,243,.35)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.ibtn svg{width:20px;height:20px}

.hero{margin:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#1c2a5e,#2a1636 70%,#3a1420);border:1px solid rgba(245,200,76,.25);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.04)}
.hero .lbl{color:var(--gold2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px}
.hero .big{font-family:"Exo 2";font-size:40px;font-weight:800;margin:4px 0 2px}
.hero .big small{font-size:16px;color:var(--mut);font-weight:600}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:"Exo 2";font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.val b{font-size:clamp(14px,4.4vw,19px);overflow:visible;text-overflow:clip}
.stat.val{flex:1.35}
.stat span{font-size:12px;color:var(--mut)}
.stat.val b{color:var(--gold2)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 10px}
.sec-title h2{font-size:18px}
.sec-title span{color:var(--mut);font-size:13px}

.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px}
@media(min-width:560px){.sgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:780px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.stile{text-align:left;display:flex;flex-direction:column;gap:8px}
.scard{position:relative;aspect-ratio:63/88;border-radius:12px;overflow:hidden;background:#0e1430;
  box-shadow:0 0 0 3px var(--gold),0 10px 24px rgba(0,0,0,.45);transition:transform .15s}
.stile:active .scard{transform:scale(.97)}
.scard .bgblur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.6) saturate(1.2)}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scard img.lgo{object-fit:contain;padding:14% 10%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.scard .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;
  background:radial-gradient(circle at 50% 35%,#2b3c7a,#121a3a);font-family:"Exo 2";font-weight:800;font-size:22px;color:var(--gold2)}
.scard .ph.nm{font-size:17px;line-height:1.15}
.scard .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.scard.complete{box-shadow:0 0 0 3px var(--gold2),0 0 22px rgba(245,200,76,.6)}
.sname{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--gold))}
.smeta{font-size:12px;color:var(--mut);margin-top:-2px}
.smeta b{color:var(--gold2);font-weight:700}
.newtile .scard{box-shadow:none;border:2px dashed var(--line);background:rgba(255,255,255,.02);display:grid;place-items:center}
.newtile .plus{width:52px;height:52px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 18px rgba(227,53,13,.5)}
.newtile .plus svg{width:26px;height:26px}

.shead{display:flex;gap:14px;align-items:center;padding:16px}
.shead .scard{width:78px;flex:none;box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.4)}
.shead .info{flex:1;min-width:0}
.shead h2{font-size:21px;line-height:1.15}
.shead .cnt{font-family:"Exo 2";font-size:28px;font-weight:800;margin-top:6px}
.shead .cnt small{font-size:14px;color:var(--mut)}
.shead .bar{margin-top:8px;height:8px}
.shead .val{margin-top:6px;font-size:13px;color:var(--mut)}
.shead .val b{color:var(--gold2);font-family:"Exo 2";font-size:16px}
.tools{position:sticky;top:calc(var(--st) + 64px);z-index:15;padding:8px 16px 10px;background:linear-gradient(180deg,rgba(11,16,32,.97) 80%,rgba(11,16,32,0))}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;color:var(--mut);flex:none}
.search input{flex:1;background:none;border:0;outline:0;height:100%;font-size:16px;min-width:0}
.search .clr{color:var(--mut);font-size:20px;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--mut)}
.chip.on{background:var(--txt);color:#0b1020;border-color:var(--txt)}
.chip .n{opacity:.7;font-weight:500}
.chip .tdot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip .tdot svg{width:12px;height:12px;color:#fff}
.chip.on.typ{color:#fff}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 16px 16px}
@media(min-width:560px){.cgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:780px){.cgrid{grid-template-columns:repeat(6,1fr)}}
.tcw{display:flex;flex-direction:column;gap:4px;min-width:0}
.tc{position:relative;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;aspect-ratio:63/88;text-align:left;width:100%;
  background:#2a2f3d;box-shadow:0 0 0 2px #3a4254}
.tc .art{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
.tc .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc .art .ico{width:44%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.tc .art .ico svg{width:58%;height:58%;color:#fff}
.tc .foot{padding:5px 6px 6px;background:rgba(0,0,0,.55);font-size:11px;line-height:1.2}
.tc.hasimg .foot{display:none}
.tc .num{font-family:"Exo 2";font-weight:700;opacity:.85}
.tc .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.miss{filter:grayscale(1);opacity:.42;box-shadow:0 0 0 1.5px #3a4254}
.tc.miss.hasimg{opacity:.5}
.tc.hasimg .art{background:#11162a}
.tc.miss .art{background:repeating-linear-gradient(135deg,#2a2f3d 0 8px,#262b38 8px 16px)}
.tc.miss .bignum{font-family:"Exo 2";font-weight:800;font-size:22px;color:#c9cfdc}
.tc.own{box-shadow:0 0 0 2.5px var(--gold),0 4px 12px rgba(0,0,0,.4)}
.tc .qty{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;font-weight:800;font-size:11px;border-radius:9px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tc .vars{position:absolute;top:5px;left:5px;display:flex;gap:3px}
.tc .vars b{font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.6);color:var(--gold2)}
.tc.foil .art:after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.35;
  background:linear-gradient(115deg,transparent 20%,#ff8af0 35%,#7af0ff 45%,#fff38a 55%,transparent 70%);background-size:250% 250%;animation:foil 4s linear infinite}
@keyframes foil{0%{background-position:100% 0}100%{background-position:-100% 0}}
.under{display:flex;align-items:baseline;gap:4px;font-size:11px;line-height:1.2;padding:0 2px}
.under .un{font-family:"Exo 2";font-weight:700;color:var(--mut);flex:none}
.under .uname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.under .pr{flex:none;font-weight:700;color:var(--gold2);text-decoration:none;padding:4px 0 4px 4px;margin:-4px 0}
.tcb{display:block;width:100%;padding:0}

.warn{background:rgba(245,200,76,.1);border:1px solid rgba(245,200,76,.35);color:var(--gold2);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.4}
.err{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.35);color:#ffb0b0;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}

.detail{display:flex;gap:14px}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}

.scanimg{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#000;display:block}

@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}

.plist{max-height:220px;overflow:auto;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:10px}

/* Catalogue des séries */
.catlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.catgrp{font-size:12px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:1px;margin:14px 2px 2px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}

/* Résultat de scan */
.match{display:flex;gap:14px;align-items:flex-start;margin:6px 0 10px}
.match .tc{width:120px;flex:none}

.match .mi b{font-family:"Exo 2";font-size:18px;display:block}
.match .mi .ms{color:var(--mut);font-size:13px}
.match .mi .pr{color:var(--gold2);font-weight:700;margin-top:4px}
.alts{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.alts::-webkit-scrollbar{display:none}
.alt{flex:none;width:86px;text-align:left;font-size:11px;color:var(--mut)}
.alt .tc{width:86px}
.alt.on .tc{box-shadow:0 0 0 3px var(--gold2)}
.match .tc.miss,.alt .tc.miss{filter:none;opacity:1}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 10px}
.cnav span{font-size:13px;color:var(--mut);font-weight:600}
.cnb{width:52px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.cnb svg{width:22px;height:22px}
.cnb:disabled{opacity:.3}
.chain{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;width:100%;text-align:left}
.chain small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
.tg{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.chain.on .tg{background:var(--ok)}.chain.on .tg:after{left:21px}
.added{display:flex;gap:14px;align-items:center;margin:6px 0 4px}
.added .tc{width:96px;flex:none}
.added b{font-family:"Exo 2";font-size:18px;display:block}
.added .ms{color:var(--mut);font-size:13px;line-height:1.45}
.okfx{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;background:rgba(3,6,15,.35);opacity:0;transition:opacity .15s}
.okfx.on{opacity:1}
.okfx .ring{width:120px;height:120px;border-radius:50%;background:var(--ok);display:grid;place-items:center;box-shadow:0 10px 40px rgba(62,207,142,.5);transform:scale(.5);transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.okfx.on .ring{transform:scale(1)}
.okfx svg{width:64px;height:64px;color:#fff}
.okfx svg path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s .12s ease-out}
.okfx.on svg path{stroke-dashoffset:0}
.okfx p{margin:14px 0 0;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.jeux{display:flex;margin:14px 16px 0;padding:4px;gap:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.jeux button{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--mut)}
.jeux button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d00}
.hsearch{padding:4px 16px 0}
.hacts{display:flex;gap:10px;padding:12px 16px 0}
.hact{flex:1;min-height:46px;padding:4px 6px;line-height:1.15;text-align:center;font-size:13px!important;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.hact svg{width:19px;height:19px;color:var(--gold2)}
.hact.hsm{flex:.6}
.hact .n{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.ccard{margin:0 16px 14px;padding:14px 14px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.ccard h2{font-size:16px}
.chart{display:block;width:100%;height:110px;margin-top:8px}
.cax{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:2px}
.cvar{margin-top:10px;font-family:"Exo 2";font-weight:800;font-size:17px}
.cvar span{font-family:Inter;font-weight:500;font-size:12px;color:var(--mut)}
.cvar.up{color:var(--ok)}.cvar.down{color:#ff8a8a}
.bbanner{margin:12px 16px 0;padding:10px 10px 10px 14px;border-radius:16px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(227,53,13,.25),rgba(245,200,76,.18));border:1px solid rgba(245,200,76,.4)}
.bbanner .bt{flex:1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gold2);font-weight:700;min-width:0}
.bbanner .bt svg{width:24px;height:24px;flex:none}
.bbanner .bt b{display:block;color:var(--txt);font-size:15px;font-family:"Exo 2"}
.bbanner button{height:40px;border-radius:12px;font-weight:700;font-size:14px;padding:0 12px}
.bbanner .bb1{background:var(--red);color:#fff;width:44px;padding:0;display:grid;place-items:center}.bbanner .bb1 svg{width:20px;height:20px}
.bbanner .bb2{background:var(--txt);color:#0b1020}
.blist{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.brow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.brow .tc{width:48px;flex:none;border-radius:6px}
.brow .tc .foot,.brow .tc .vars,.brow .tc .qty{display:none}
.brow .bi{flex:1;min-width:0}.brow .bi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .bi span{font-size:12px;color:var(--mut)}
.brow .bp{flex:none;font-weight:700;color:var(--gold2);font-size:14px}
.gain{font-family:"Exo 2";font-weight:800;font-size:18px;margin:4px 0}.gain.up{color:var(--ok)}.gain.down{color:#ff8a8a}
.dbllink{margin-top:6px;font-size:13px;font-weight:700;color:var(--gold2);padding:0}
.chipsel{flex:none;height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;padding:0 10px;max-width:180px}
.chipsel.on{background:var(--txt);color:#0b1020}
.toptabs{display:flex;gap:6px;margin:4px 0 10px}
.mv{font-weight:800;font-size:13px}.mv.up{color:var(--ok)}.mv.down{color:#ff8a8a}
.envo{position:absolute;bottom:4px;right:4px;font-size:8px;font-weight:800;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.65);color:#cfd6ea;letter-spacing:.5px}
.alt span{display:block;margin-top:4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translate(-50%,20px);opacity:0;z-index:80;background:#fff;color:#0b1020;
  padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{margin:12px 16px;padding:12px 14px;border-radius:12px;background:rgba(245,200,76,.1);border:1px solid rgba(245,200,76,.3);color:var(--gold2);font-size:13px}
.hidden{display:none!important}

/* ===== Toucher : retour immédiat à l'appui ===== */
.tcb .tc,.btn,.chip,.hact,.fab button,.ibtn,.cnb,.ctr button,.crow,.alt .tc,.seg button,.jeux button,.chain,.bbanner button,.cmlink,.dbllink{transition:transform .12s ease-out}
.tcb:active .tc,.btn:active:not(:disabled),.chip:active,.hact:active,.fab button:active,.ibtn:active,.cnb:active:not(:disabled),.crow:active,.alt:active .tc,.seg button:active,.jeux button:active,.chain:active,.bbanner button:active,.cmlink:active{transform:scale(.96)}
.ctr button:active{transform:scale(.88)}
/* ===== Fenêtre du bas pilotée au doigt (ressorts) ===== */
.sheet{transition:none;will-change:transform;touch-action:pan-y;overscroll-behavior:contain}
.veil{transition:none}
.grab{position:relative;cursor:grab}
.grab:before{content:"";position:absolute;inset:-14px -80px}
.shc{will-change:transform}
.flyc{position:fixed!important;left:0;top:0;z-index:60;pointer-events:none;margin:0;transform-origin:0 0;box-shadow:0 18px 40px rgba(0,0,0,.55)!important}
/* ===== Holo : le reflet suit l'inclinaison du téléphone ===== */
.tc.foil .art:after{animation:none;background-position:calc(50% + var(--tx,0) * 110%) calc(50% + var(--ty,0) * 60%);opacity:calc(.22 + var(--tm,0) * .5)}
/* ===== Révélation des cartes rares ===== */
.rvx{position:fixed;inset:0;z-index:95;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .18s;
  background:radial-gradient(circle at 50% 42%,rgba(245,200,76,.32),rgba(3,6,15,.88) 62%)}
.rvx.on{opacity:1}
.rvb{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.rays{position:absolute;width:560px;height:560px;left:50%;top:40%;margin:-280px 0 0 -280px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,231,154,.2) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 64%);mask:radial-gradient(circle,#000 18%,transparent 64%);
  opacity:0;transform:scale(.6) rotate(0deg);transition:transform 1.4s ease-out,opacity .3s}
.rvx.on .rays{opacity:1;transform:scale(1) rotate(28deg)}
.rc{position:relative;width:min(54vw,230px);transform:scale(.55) rotateY(80deg);transition:transform .55s cubic-bezier(.2,1.3,.35,1);filter:drop-shadow(0 0 26px rgba(255,214,102,.65))}
.rvx.on .rc{transform:none}
.rc .tc{width:100%}
.rc:after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);background-size:300% 100%;background-position:120% 0}
.rvx.on .rc:after{animation:sweep .9s .3s ease-out forwards}
@keyframes sweep{to{background-position:-20% 0}}
.rl{text-align:center;opacity:0;transform:translateY(10px);transition:opacity .25s .35s,transform .35s .35s}
.rvx.on .rl{opacity:1;transform:none}
.rl .rr{display:inline-block;padding:4px 12px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d00;font-weight:800;font-size:13px;letter-spacing:.3px}
.rl b{display:block;margin-top:8px;font-family:"Exo 2";font-size:30px;font-weight:800;color:var(--gold2);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.rl small{display:block;margin-top:4px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
/* ===== Réglage « réduire les animations » du téléphone ===== */
@media (prefers-reduced-motion: reduce){
  .sheet,.veil{transition:opacity .2s!important}
  .sheet:not(.on){visibility:hidden}
  .tc.foil .art:after{opacity:.3}
  .okfx .ring,.okfx.on .ring{transform:none;transition:none}
  .rays{display:none}
  .rc,.rvx.on .rc{transform:none;transition:none}
  .rvx.on .rc:after{animation:none}
  .rl{transform:none;transition:opacity .2s}
  .toast{transition:opacity .2s}
}
</style>

<div class="fab" id="fab">
  <button class="add hidden" id="fabAdd" aria-label="Ajouter une carte avec son numéro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="scan hidden" id="fabScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="7" width="8" height="10" rx="1.5"/></svg>Scanner une carte</button>
</div>

<div class="okfx" id="okfx"><div><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><p id="okfxT"></p></div></div>

/* ============ Utilitaires ============ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const squash = s=>norm(s).replace(/[^a-z0-9]/g,"");
const uid = ()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const blobUrl = id=>id?("/_blob/"+id):"";
function keyOf(numero){
  let s = String(numero??"").trim().toUpperCase().replace(/\s+/g,"");
  s = s.split("/")[0];
  if(/^\d+$/.test(s)) return String(parseInt(s,10));
  return s.replace(/[^A-Z0-9_.-]/g,"_");
}
function pad(k,total){ return /^\d+$/.test(k) ? k.padStart(String(total||k).length<3?3:String(total).length,"0") : k; }
function qtot(c){ if(!c||!c.qte) return 0; return (c.qte.normale||0)+(c.qte.reverse||0)+(c.qte.holo||0); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2800); }
const EUR = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur = v=> v==null||isNaN(v) ? "" : EUR.format(v);
function typeFix(t){ if(!t) return ""; const n=norm(t); const f=TYPES.find(x=>norm(x.k)===n); if(f) return f.k;
  const map={grass:"Plante",fire:"Feu",water:"Eau",lightning:"Électrique",electrique:"Électrique",psychic:"Psy",fighting:"Combat",darkness:"Obscurité",tenebres:"Obscurité",metal:"Métal",acier:"Métal",fairy:"Fée",colorless:"Incolore",trainer:"Dresseur",objet:"Dresseur",supporter:"Dresseur",stade:"Dresseur",energy:"Énergie",energie:"Énergie",dragon:"Dragon"};
  return map[n]||""; }
async function resizeImage(file,max=1100,keepPng=false){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);}); }
  const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  const png = keepPng && file.type==="image/png";
  return await new Promise(r=>c.toBlob(r,png?"image/png":"image/jpeg",0.86));
}
function pickFile({camera=false,multiple=false}={}){
  return new Promise(res=>{
    const i=document.createElement("input"); i.type="file"; i.accept="image/*"; if(camera) i.setAttribute("capture","environment"); if(multiple) i.multiple=true;
    i.style.display="none"; document.body.appendChild(i);
    i.onchange=()=>{ const f=[...(i.files||[])]; i.remove(); res(multiple?f:(f[0]||null)); };
    i.click();
  });
}
function dbMsg(e){ const c=e&&e.code;
  if(c==="quota_exceeded") return "Stockage plein : supprime d'anciennes données.";
  if(c==="revoked"||c==="not_granted") return "Accès à la collection indisponible.";
  return "Enregistrement impossible, réessaie."; }
async function pool(items,n,fn,onStep){ let i=0,done=0; const run=async()=>{ while(i<items.length){ const it=items[i++]; await fn(it); done++; onStep&&onStep(done); } }; await Promise.all(Array.from({length:Math.min(n,items.length)},run)); }

/* ============ Catalogue officiel (toutes les séries, images, prix) ============ */
let CAT=null;             // catalogue.json
const CC={};              // cartes décodées par extension : {list, map}
const PK={}, PKR={};      // paquets d'images : promesse / résultat
let PRIX={};              // prix du jour (base de données), par extension
function catSet(id){ return CAT&&CAT.sets[id]||null; }
function catCards(id){
  if(CC[id]) return CC[id]; const st=catSet(id); if(!st) return null;
  const list=st.c.map(a=>({n:a[0],k:keyOf(a[0]),nom:a[1],type:CAT.types[a[2]]||"",rar:CAT.rar[a[3]]||"",o:a[4],l:a[5],p:a[6],ph:a[7],m:a[8]||0,cm:a[9]||0,orig:a[10]||"",en:a[11]||0}));
  return CC[id]={list,map:new Map(list.map(x=>[x.k,x]))};
}
function catCard(id,k){ const c=catCards(id); return c?c.map.get(k)||null:null; }
/* Lien vers la page de vente Cardmarket de la carte */
function cmUrl(cid,k){ const x=cid?catCard(cid,k):null; if(!x) return "";
  const g=jeuSet(cid)==="lorcana"?"Lorcana":"Pokemon";
  if(x.cm) return `https://www.cardmarket.com/fr/${g}/Products?idProduct=`+x.cm;
  return `https://www.cardmarket.com/fr/${g}/Products/Search?searchString=`+encodeURIComponent(x.nom); }
function prLink(cid,k,text,cls="pr"){ const u=cmUrl(cid,k); return u?`<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener">${text}</a>`:`<span class="${cls}">${text}</span>`; }
/* Versions qui existent pour cette carte (normale / reverse / holo), + celles déjà possédées */
const VBIT={normale:1,reverse:2,holo:4};
const VARS_LOR=[{k:"normale",l:"Normale",s:""},{k:"holo",l:"Foil",s:"F"}];
function varsFor(cid,k,qte){ const x=cid?catCard(cid,k):null; const m=x&&x.m||0; const base=cid&&jeuSet(cid)==="lorcana"?VARS_LOR:VARS; if(!m) return base;
  return base.filter(v=>(m&VBIT[v.k]) || (qte&&qte[v.k]>0)); }
function loadPack(id){
  if(!PK[id]) PK[id]=fetch("packs/"+encodeURIComponent(id)+".webp").then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b=>(PKR[id]={b,u:new Map()})).catch(()=>(PKR[id]=null));
  return PK[id];
}
function packUrl(id,o,l){
  if(o==null||o<0) return ""; const P=PKR[id]; if(!P) return "";
  const key=o; let u=P.u.get(key); if(!u){ u=URL.createObjectURL(new Blob([P.b.slice(o,o+l)],{type:"image/webp"})); P.u.set(key,u); } return u;
}
function cardImg(id,c){ return c&&c.o>=0 ? packUrl(id,c.o,c.l) : ""; }
function logoUrl(id){ const st=catSet(id); return st&&st.logo ? packUrl("logos",st.logo[0],st.logo[1]) : ""; }
function prixOf(setId,k){
  const d=PRIX[setId]; if(d&&d.p&&d.p[k]) return d.p[k];
  const c=catCard(setId,k); return c&&(c.p!=null||c.ph!=null)?[c.p,c.ph]:null;
}

function slots(){
  const s=curSerie(), total=s.total||0, list=[], seen=new Set(), cid=catOf(s);
  if(cid){ for(const x of catCards(cid).list){ seen.add(x.k); list.push(withCat(cid,x.k,S.cards.get(x.k))); } }
  else for(let i=1;i<=total;i++){ const k=String(i); seen.add(k); list.push(S.cards.get(k)||{_id:k,numero:k,_slot:true}); }
  const extra=[...S.cards.values()].filter(c=>!seen.has(c._id)).sort((a,b)=>{
    const na=parseInt(a._id,10),nb=parseInt(b._id,10);
    if(!isNaN(na)&&!isNaN(nb)) return na-nb; if(!isNaN(na)) return -1; if(!isNaN(nb)) return 1; return a._id.localeCompare(b._id,"fr",{numeric:true}); });
  return list.concat(extra);
}
function withCat(cid,k,c){
  const x=cid?catCard(cid,k):null; if(!x) return c||null;
  const b={_id:k,numero:k,nom:x.nom,type:typeFix(x.type),rarete:x.rar,_cat:x,_slot:true};
  if(!c) return b;
  return {...b,...c,nom:c.nom||b.nom,type:c.type||b.type,rarete:c.rarete||b.rarete,_cat:x};
}
function filtered(all){
  const f=S.f, q=norm(f.q);
  return all.filter(c=>{
    const n=qtot(c);
    if(f.poss==="own"&&n<1) return false;
    if(f.poss==="miss"&&n>0) return false;
    if(f.poss==="dbl"&&n<2) return false;
    if(f.type&&c.type!==f.type) return false;
    if(q){
      const qn=q.replace(/^#|^n°?/,"");
      const numHit = /^\d+$/.test(qn) ? c._id===String(parseInt(qn,10)) || c._id.startsWith(qn.replace(/^0+/,"")) && qn.replace(/^0+/,"").length>0 : norm(c._id)===qn;
      if(!numHit && !norm(c.nom).includes(q)) return false;
    }
    if(f.rar&&(c.rarete||"")!==f.rar) return false;
    return true;
  }).sort(sorter());
}
/* Tri : numéro (ordre de la série), prix, rareté */
const RANG=["commune","peu commune","inhabituelle","rare","rare holo","double rare","tres rare","illustration rare","ultra rare","legendaire","epique","illustration speciale rare","hyper rare","enchantee","mega hyper rare","iconique","speciale"];
const rang = r=>{ const i=RANG.indexOf(norm(r)); return i<0?(r?7.5:-1):i; };
function sorter(){
  const m=S.f.sort||"num"; if(m==="num") return ()=>0;
  const cid=catOf(curSerie());
  const pr=c=>cid?(basePrice(cid,c)||0):0;
  if(m==="pd") return (a,b)=>pr(b)-pr(a);
  if(m==="pa") return (a,b)=>(pr(a)||1e9)-(pr(b)||1e9);
  if(m==="rar") return (a,b)=>rang(b.rarete)-rang(a.rarete)||pr(b)-pr(a);
  return ()=>0;
}
/* Carte seule (sans légende) */
function tileCard(c,total,cid,offi){

  let art;

  else if(ci) art=`<img src="${ci}" loading="lazy" alt="">${cx&&cx.en?`<span class="envo">EN</span>`:""}`;
  else if(own) art=`<div class="ico">${t?ICON(t.i):'<span class="bignum">?</span>'}</div>`;

const RM = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
document.addEventListener("touchstart",()=>{},{passive:true});   // active l'effet d'appui partout
/* Vibrations : seulement aux moments importants */
function buzz(kind){ const p={add:30,dbl:[25,60,25],rare:[30,70,30,70,90],done:[40,60,40,60,140]}[kind]; try{ p&&navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
/* Bip de scan (suit le volume multimédia) */
let AC=null;
function bipOn(){ try{ return localStorage.getItem("bipScan")!=="0"; }catch(e){ return true; } }
function primeAudio(){ if(!bipOn()) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }
function bip(){ if(!bipOn()) return; try{ primeAudio(); if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.setValueAtTime(1760,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.11); }catch(e){} }
function bipBtn(){ return `<button class="chain ${bipOn()?"on":""}" id="bipT"><span class="tg"></span><span>Bip au scan<small>Un bip court quand une carte est ajoutée. Il suit le volume multimédia du téléphone.</small></span></button>`; }
function bindBip(sh){ const b=$("#bipT",sh); if(!b) return; b.onclick=()=>{ const on=!bipOn(); try{ localStorage.setItem("bipScan",on?"1":"0"); }catch(e){} b.classList.toggle("on",on); if(on){ primeAudio(); bip(); } }; }

/* Ressort à la manière d'Apple : amortissement 1 = sans rebond, réponse en secondes.
   Il part toujours de la position actuelle et garde la vitesse : on peut l'attraper en plein vol. */
function spring(o){
  let x=o.from, v=o.v||0, raf=0, last=performance.now(); const eps=o.eps||.4;
  const k=Math.pow(2*Math.PI/o.resp,2), c=4*Math.PI*o.damp/o.resp;
  const h={get x(){ return x; }, stop(){ if(raf) cancelAnimationFrame(raf); raf=0; }};
  if(RM.matches){ o.on(o.to); o.done&&o.done(); return h; }
  const step=now=>{ let dt=Math.min(.05,(now-last)/1000); last=now;
    while(dt>0){ const st=Math.min(dt,1/240); v+=(-k*(x-o.to)-c*v)*st; x+=v*st; dt-=st; }
    if(Math.abs(x-o.to)<eps && Math.abs(v)<60){ raf=0; x=o.to; v=0; o.on(x); o.done&&o.done(); return; }
    o.on(x); raf=requestAnimationFrame(step); };
  raf=requestAnimationFrame(step); return h;
}
/* Vitesse du doigt sur les 100 dernières ms */
function vtrack(){ const pts=[]; return { add(p){ const t=performance.now(); pts.push([t,p]); while(pts.length>2&&t-pts[0][0]>100) pts.shift(); },
  v(){ if(pts.length<2) return 0; const a=pts[0], b=pts[pts.length-1], dt=(b[0]-a[0])/1000; return dt>0?(b[1]-a[1])/dt:0; } }; }
/* Où le geste s'arrêterait avec son élan */
const project=(v,d=.998)=>(v/1000)*d/(1-d);
/* Résistance progressive au-delà d'une limite */
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));

/* Une copie de la carte vole d'un endroit à l'autre (ouverture et fermeture de la fiche) */
function flyCard(fromEl,toGet,{hideTo=true,hideFrom=false}={}){ return new Promise(res=>{
  const to0=toGet(); if(RM.matches||!fromEl||!to0||!fromEl.isConnected) return res();
  const a=fromEl.getBoundingClientRect(); if(!a.width) return res();
  const cl=fromEl.cloneNode(true); cl.classList.add("flyc"); cl.style.width=a.width+"px"; cl.style.height=a.height+"px";
  cl.style.transform=`translate(${a.left}px,${a.top}px)`; document.body.appendChild(cl);
  let hidden=null; const hide=el=>{ if(hidden&&hidden!==el) hidden.style.visibility=""; hidden=el; if(el) el.style.visibility="hidden"; };
  if(hideFrom) fromEl.style.visibility="hidden";
  spring({from:0,to:1000,damp:1,resp:.42,eps:3,on:p=>{ p/=1000; const t=toGet(); if(!t) return; if(hideTo) hide(t);
      const b=t.getBoundingClientRect(); const sc=1+(b.width/a.width-1)*p;
      cl.style.transform=`translate(${a.left+(b.left-a.left)*p}px,${a.top+(b.top-a.top)*p}px) scale(${sc})`; },
    done:()=>{ cl.remove(); hide(null); fromEl.style.visibility=""; res(); }});
}); }

/* ============ Fenêtre du bas ============ */
let onClose=null;
const SY={y:null,sp:null,open:false,fly:null,relV:0};
let CD=null;   // carte affichée dans la fiche (pour le glisser gauche/droite)
function shH(){ return $("#sheet").offsetHeight||innerHeight; }
function setSheetY(y){ const sh=$("#sheet"), v=$("#veil"); SY.y=y; const h=shH(), p=Math.max(0,Math.min(1,1-y/h));
  sh.style.transform=`translateY(${y}px)`; v.style.opacity=p; }
function moveSheet(to,v,done){ if(SY.sp) SY.sp.stop(); const sh=$("#sheet");
  if(RM.matches){ /* animations réduites : simple fondu, sans glissement */
    if(to===0){ sh.style.opacity=0; setSheetY(0); void sh.offsetWidth; sh.style.opacity=1; done&&done(); }
    else { sh.style.opacity=0; $("#veil").style.opacity=0; clearTimeout(SY.rmT); SY.rmT=setTimeout(()=>{ if(SY.open) return; setSheetY(to); sh.style.opacity=""; done&&done(); },200); }
    return; }
  const from=SY.y==null?shH():SY.y;
  SY.sp=spring({from,to,v:v||0,damp:1,resp:to===0?.38:.3,eps:.5,on:setSheetY,done}); }
function openSheet(html,bind){
  const sh=$("#sheet"), v=$("#veil");
  const was=SY.open; SY.open=true; SY.fly=null; CD=null;
  sh.innerHTML=`<div class="grab"></div><div class="shc">`+html+`</div>`; sh.scrollTop=0; sh.dataset.swipe="";
  v.style.display="block"; sh.classList.add("on"); v.classList.add("on");
  if(!was && (SY.y==null || SY.y>=shH()-1)) setSheetY(shH());
  moveSheet(0,0);
  v.onclick=closeSheet; bind&&bind(sh);
}
function closeSheet(){
  const f=onClose; onClose=null;
  if(!SY.open){ f&&f(); return; }
  SY.open=false; CD=null; const sh=$("#sheet"), v=$("#veil"); const fly=SY.fly; SY.fly=null;
  moveSheet(shH(),SY.relV||0,()=>{ if(!SY.open){ v.style.display="none"; sh.classList.remove("on"); v.classList.remove("on"); } });
  SY.relV=0; f&&f(); fly&&fly();
}
/* Gestes dans la fenêtre : glisser vers le bas pour fermer, gauche/droite pour changer de carte */
(function sheetGestures(){
  const sh=$("#sheet"); let g=null;
  sh.addEventListener("touchstart",e=>{ if(e.touches.length>1||!SY.open){ g=null; return; } const t=e.touches[0], tg=e.target;
    g = tg.closest("input,textarea,select,.alts,.chips,.plist,.seg") ? {skip:true}
      : {x0:t.clientX,y0:t.clientY,axis:null,vt:vtrack(),onGrab:!!tg.closest(".grab,.cnav,h3")}; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(!g||g.skip) return; const t=e.touches[0], dx=t.clientX-g.x0, dy=t.clientY-g.y0;
    if(!g.axis){ if(Math.hypot(dx,dy)<10) return;
      if(dy>0 && Math.abs(dy)>Math.abs(dx)*1.2 && (sh.scrollTop<=0||g.onGrab)){ g.axis="y"; g.base=SY.y||0; g.y0=t.clientY; if(SY.sp) SY.sp.stop(); }
      else if(CD && sh.dataset.swipe && Math.abs(dx)>Math.abs(dy)*1.5){ g.axis="x"; g.x0=t.clientX; cardDragStart(); }
      else { g.skip=true; return; } }
    if(e.cancelable) e.preventDefault();
    if(g.axis==="y"){ let y=g.base+(t.clientY-g.y0); if(y<0) y=-rubber(-y,shH()); setSheetY(y); g.vt.add(t.clientY); }
    else { g.vt.add(t.clientX); cardDragMove(t.clientX-g.x0); }
  },{passive:false});
  const end=()=>{ const G=g; g=null; if(!G||G.skip||!G.axis) return; const v=G.vt.v();
    if(G.axis==="y"){ const h=shH(), proj=SY.y+project(v,.99);
      if(v>800 || (proj>h*.4 && v>-100)){ SY.relV=Math.max(0,v); closeSheet(); } else moveSheet(0,v); }
    else cardDragEnd(v); };
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
})();
/* Glisser une carte à gauche ou à droite dans sa fiche */
function cardDragStart(){ if(!CD) return; if(CD.sp) CD.sp.stop(); CD.base=CD.x||0; }
function cardDragMove(dx){ if(!CD) return; let x=CD.base+dx;
  if((x>0&&CD.pos<=0)||(x<0&&CD.pos>=CD.order.length-1)) x=rubber(x,innerWidth);
  CD.set(x); }
function cardDragEnd(v){ const cd=CD; if(!cd) return; const W=innerWidth, x=cd.x, p=x+project(v,.99);
  const dir = p<-W*.35&&cd.pos<cd.order.length-1 ? 1 : p>W*.35&&cd.pos>0 ? -1 : 0;
  if(!dir){ cd.sp=spring({from:x,to:0,v,damp:1,resp:.3,on:cd.set}); return; }
  cd.sp=spring({from:x,to:-dir*W,v,damp:1,resp:.22,eps:30,on:cd.set,done:()=>{ if(CD===cd) cd.go(dir,v); }}); }

/* ============ Ajouter une série officielle ============ */
function setRows(q){
  if(!CAT) return `<div class="spin"></div>`;
  const nq=norm(q), added=new Set(S.series.map(s=>s.catalogue).filter(Boolean));
  let h="", any=false;
  for(const b of CAT.blocs){
    if((b.jeu||"pokemon")!==S.jeu) continue;
    const ids=b.sets.filter(id=>{ const st=CAT.sets[id]; return !nq || norm(st.nom).includes(nq) || norm(b.nom).includes(nq) || norm(st.code||"").includes(nq) || String(st.d||"").startsWith(nq); });
    if(!ids.length) continue; any=true;
    h+=`<div class="catgrp">${esc(b.nom)}</div>`;
    for(const id of ids){ const st=CAT.sets[id], lu=logoUrl(id), done=added.has(id);
      h+=`<button class="crow ${done?"done":""}" data-add="${esc(id)}"><div class="lg">${lu?`<img src="${lu}" alt="">`:`<span>${esc(st.code||"")}</span>`}</div>
        <div class="tx"><b>${esc(st.nom)}</b><small>${st.c.length} cartes${st.d?" · "+st.d.slice(0,4):""}${st.img?"":" · sans images"}</small></div><span class="go">${done?"Ajoutée ✓":"Ajouter"}</span></button>`; }
  }
  return any?h:`<div class="empty"><b>Aucune série</b>Essaie un autre nom.</div>`;
}
function refreshSheetLogos(){ const l=$("#catL"); if(l){ l.innerHTML=setRows($("#catQ").value); bindRows($("#sheet")); } }
function bindRows(sh){
  sh.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.add; const ex=S.series.find(s=>s.catalogue===id);
    if(ex){ closeSheet(); location.hash="s-"+ex.id; return; }
    b.disabled=true; b.querySelector(".go").textContent="…";
    try{ const sid=await ensureSeries(id); closeSheet(); toast("Série ajoutée : "+CAT.sets[id].nom); location.hash="s-"+sid; }
    catch(e){ b.disabled=false; b.querySelector(".go").textContent="Ajouter"; toast(dbMsg(e)); }
  });
}
function sheetCatalogue(){
  openSheet(`<h3>Ajouter une série ${JEUX[S.jeu]}</h3><div class="sub">Toutes les séries officielles en français, avec la liste des cartes, leurs images et leurs prix.</div>
    <div class="search">${IC.search}<input id="catQ" type="search" placeholder="Nom, bloc ou année…" autocomplete="off"></div>
    <div class="catlist" id="catL">${setRows("")}</div>
    <button class="btn sec" id="perso">${IC.edit} Créer une série perso</button>`, sh=>{
    bindRows(sh);
    $("#catQ",sh).oninput=e=>{ $("#catL",sh).innerHTML=setRows(e.target.value); bindRows(sh); };
    $("#perso",sh).onclick=()=>{ closeSheet(); setTimeout(()=>sheetSerie(null),260); };
  });
}
async function ensureSeries(cid){
  const ex=S.series.find(s=>s.catalogue===cid); if(ex) return ex.id;
  const st=CAT.sets[cid];
  const sid=(cid.toLowerCase().replace(/[^a-z0-9]/g,"")||"s")+uid().slice(0,4);
  const doc={nom:st.nom,officiel:st.off||st.c.length,total:st.c.length,catalogue:cid,logoId:null,creeLe:Date.now(),possedees:0,valeur:0,maj:Date.now()};
  await db.doc("series/"+sid).set(doc);
  if(!S.series.find(s=>s.id===sid)) S.series.push({id:sid,...doc});
  return sid;
}

/* ============ Série perso : créer / modifier ============ */
function sheetSerie(s){
  const isNew=!s; let logoBlob=null, logoId=s?s.logoId:null;
  openSheet(`<h3>${isNew?"Nouvelle série perso":"Modifier la série"}</h3><div class="sub">Le logo s'affiche au format carte sur l'accueil.</div>
    <div class="logo-pick"><div id="lp">${s?logoCard(s):logoCard({nom:"?"})}</div><div style="flex:1"><button class="btn sec" id="pickLogo">${IC.img} ${logoId||s?.catalogue?"Changer le logo":"Choisir le logo"}</button><p class="hint">Une image au format carte rend le mieux.</p></div></div>
    <label class="fld"><span>Nom de la série</span><input id="sNom" value="${esc(s?.nom||"")}" placeholder="Ex. Mes promos"></label>
    ${s?.catalogue?"":`<div class="row2"><label class="fld"><span>Cartes numérotées</span><input id="sOff" type="number" inputmode="numeric" min="0" value="${s?.officiel||""}" placeholder="Ex. 198"></label>
    <label class="fld"><span>Total avec secrètes</span><input id="sTot" type="number" inputmode="numeric" min="0" value="${s?.total||""}" placeholder="Ex. 254"></label></div>
    <p class="hint">« Cartes numérotées » = le nombre après la barre (025/<b>198</b>). Le total inclut les cartes secrètes au-delà.</p>`}
    <div id="sErr"></div>
    <button class="btn pri" id="sSave">${isNew?"Créer la série":"Enregistrer"}</button>`, sh=>{
    $("#pickLogo",sh).onclick=async()=>{ const f=await pickFile(); if(!f) return; logoBlob=await resizeImage(f,900,true);
      const u=URL.createObjectURL(logoBlob); $("#lp",sh).innerHTML=`<div class="scard"><div class="bgblur" style="background-image:url('${u}')"></div><img src="${u}"><div class="shine"></div></div>`; };
    $("#sSave",sh).onclick=async()=>{
      const nom=$("#sNom",sh).value.trim();
      let off = s?.catalogue ? s.officiel : (parseInt($("#sOff",sh).value,10)||0);
      let tot = s?.catalogue ? s.total : (parseInt($("#sTot",sh).value,10)||0);
      if(!nom){ $("#sErr",sh).innerHTML=`<div class="err">Donne un nom à la série.</div>`; return; }
      if(!tot) tot=off; if(!off) off=tot; if(tot<off) tot=off;
      const b=$("#sSave",sh); b.disabled=true; b.textContent="Enregistrement…";
      try{
        if(logoBlob){ if(!assets) throw {msg:"L'envoi d'images n'est pas disponible ici."}; const a=await assets.upload(logoBlob); logoId=a.id; }
        const id = s?s.id:uid();
        const base = s?{...s}:{creeLe:Date.now(),possedees:0,jeu:S.jeu}; delete base.id;
        await db.doc("series/"+id).set({...base,nom,officiel:off,total:tot,logoId:logoId||null,maj:Date.now()});
        closeSheet(); toast(isNew?"Série créée":"Série mise à jour");
        if(isNew) location.hash="s-"+id;
      }catch(e){ b.disabled=false; b.textContent=isNew?"Créer la série":"Enregistrer"; $("#sErr",sh).innerHTML=`<div class="err">${esc(e.msg||dbMsg(e))}</div>`; }
    };
  });
}

/* ============ Enregistrement d'une carte ============ */
function saveCard(c,delay=500){
  const sid=S.cur, k=c._id, dk=sid+"|"+k;
  c.maj=Date.now(); S.cards.set(k,c); dirty.set(dk,c);
  clearTimeout(timers.get(dk));
  timers.set(dk,setTimeout(()=>flush(sid,k),delay));
}
function bodyOf(c,k){ return {numero:c.numero||k,nom:c.nom||"",type:c.type||"",rarete:c.rarete||"",qte:{normale:c.qte?.normale||0,reverse:c.qte?.reverse||0,holo:c.qte?.holo||0},photoId:c.photoId||null,maj:c.maj||Date.now()}; }
function flush(sid,k){
  const dk=sid+"|"+k, c=dirty.get(dk); if(!c) return Promise.resolve();
  timers.delete(dk);
  return queue(`series/${sid}/cartes/${k}`,async()=>{ await db.doc(`series/${sid}/cartes/${k}`).set(bodyOf(c,k)); if(dirty.get(dk)===c) dirty.delete(dk); updateStats(sid); });
}
function updateStats(sid){
  if(S.cur!==sid) return;
  const s=curSerie(); if(!s) return; const cid=catOf(s);
  const cards=[...S.cards.values()];
  const n=cards.filter(c=>qtot(c)>0).length;
  const v=cid?Math.round(cards.reduce((a,c)=>a+cardValue(cid,c),0)*100)/100:0;
  if(n===s.possedees && Math.abs((s.valeur||0)-v)<0.01) return;
  queue("series/"+sid,()=>db.doc("series/"+sid).update({possedees:n,valeur:v}));
}
function getCard(k){ const s=curSerie(); const c=withCat(catOf(s),k,S.cards.get(k)); const d={_id:k,numero:k,nom:"",type:"",rarete:"",qte:{normale:0,reverse:0,holo:0},photoId:null};
  if(!c) return d; const x=c._cat; const r=JSON.parse(JSON.stringify({...d,...c,_cat:undefined,_id:k,qte:c.qte||{normale:0,reverse:0,holo:0}})); if(x) r._cat=x; return r; }

/* ============ Scan photo : reconnaît la carte ET sa série ============ */
function identify(r){
  if(!CAT) return [];
  let num = r.numero ? keyOf(r.numero) : "";
  if(S.jeu==="lorcana" && num && r.sur && !/^\d+$/.test(String(r.sur).trim())) num=keyOf(String(r.sur).trim()+"-"+r.numero);
  const sur = parseInt(r.sur,10)||0;
  const code = squash(r.code||"");
  const nm = squash(r.nom||"");
  const nmFirst = norm(r.nom||"").split(/[\s-]+/)[0]||"";
  const followed = new Set(S.series.map(s=>s.catalogue).filter(Boolean));
  const cur = curSerie(); const curCid = cur && catOf(cur);
  const out=[];
  for(const [id,st] of Object.entries(CAT.sets)){
    if((st.jeu||"pokemon")!==S.jeu) continue;
    let codeHit = code && st.codes && st.codes.some(x=>squash(x)===code);
    const scanList = num ? [catCard(id,num)].filter(Boolean) : (nm ? catCards(id).list : []);
    for(const x of scanList){
      const xn=squash(x.nom);
      let sc=0;
      if(nm){ if(xn===nm) sc+=6; else if(xn.includes(nm)||nm.includes(xn)) sc+=4; else if(norm(x.nom).startsWith(nmFirst)&&nmFirst.length>2) sc+=2; else continue; }
      if(num && x.k===num) sc+=2;
      if(sur && st.off===sur) sc+=4;
      if(codeHit) sc+=5;
      if(followed.has(id)) sc+=1;
      if(id===curCid) sc+=1;
      if(x.o>=0) sc+=0.5;
      if(r.reedition30 && x.orig) sc+=6;
      out.push({id,k:x.k,x,sc,st});
    }
    /* Rééditions (Collection Classique) : elles gardent le numéro de la carte d'origine */
    /* Promos des coffrets 30 ans (ETB, UPC…) rangées dans la série : « MEP 101 » */
    if(num) for(const x of catCards(id).list){ if(!x.orig||!x.orig.startsWith("MEP ")) continue;
      const pn=keyOf(x.orig.slice(4)); if(pn!==num && "MEP"+pn!==num) continue;
      const xn=squash(x.nom); let sc=0;
      if(nm){ if(xn===nm) sc+=6; else if(xn.includes(nm)||nm.includes(xn)) sc+=4; else continue; }
      if(code==="mep") sc+=8; if(followed.has(id)) sc+=1;
      out.push({id,k:x.k,x,sc,st}); }
    if(num) for(const x of catCards(id).list){ if(!x.orig||x.orig.startsWith("MEP ")) continue; const [on,ot]=x.orig.split("/"); if(keyOf(on)!==num) continue;
      const xn=squash(x.nom); let sc=0;
      if(nm){ if(xn===nm) sc+=6; else if(xn.includes(nm)||nm.includes(xn)) sc+=4; else continue; }
      if(sur && +ot===sur) sc+=4; if(r.reedition30) sc+=6; else sc-=1; if(followed.has(id)) sc+=1;
      out.push({id,k:x.k,x,sc,st}); }
  }
  out.sort((a,b)=>b.sc-a.sc || String(b.st.d||"").localeCompare(String(a.st.d||"")));
  return out.slice(0,8);
}
function promptLorcana(){ return `Voici la photo d'une carte du jeu de cartes à collectionner Disney Lorcana, en version française.

const RARES=new Set(["Holo Rare","Holo Rare V","Holo Rare VMAX","Holo Rare VSTAR","Rare Holo","Rare Holo LV.X","Double rare","Ultra Rare","Illustration rare","Illustration spéciale rare",
  "Magnifique rare","Magnifique","Shiny rare","Shiny rare V","Shiny rare VMAX","Chromatique ultra rare","Hyper rare","Méga Hyper Rare","Mega Attack Rare","Radieux Rare","Rare Prime",

function isReveal(rar,price){ return RARES.has(rar||"") || (price||0)>=10; }
function reveal(c,vr,price){ return new Promise(res=>{

    const s0=curSerie(); const done=!was && s0 && s0.total>0 && slots().filter(x=>qtot(x)>0).length>=s0.total; return {was,done:!!done}; }
  const path=`series/${sid}/cartes/${k}`;
  let cur=null;
  try{ const sn=await db.doc(path).get(); cur = sn ? (typeof sn.data==="function" ? sn.data() : sn.data) : null; if(sn&&sn.exists===false) cur=null; }catch(e){ cur=null; }
  const x=catCard(cid,k)||{};
  const c={numero:k,nom:cur?.nom||x.nom||"",type:cur?.type||typeFix(x.type),rarete:cur?.rarete||x.rar||"",qte:{normale:cur?.qte?.normale||0,reverse:cur?.qte?.reverse||0,holo:cur?.qte?.holo||0},photoId:cur?.photoId||null,maj:Date.now()};

const ALL={}; // id série -> {t, map}
async function cardsOf(sid){
  if(S.cur===sid && S.cardsLoaded) return S.cards;
  const c=ALL[sid]; if(c && Date.now()-c.t<60000) return c.map;
  const snap=await db.collection("series/"+sid+"/cartes").get();
  const m=new Map(); snap.docs.forEach(d=>m.set(d.id,{...d.data(),_id:d.id}));
  ALL[sid]={t:Date.now(),map:m}; return m;
}
let gsTok=0;
async function globalSearch(){
  const box=$("#gres"); if(!box) return;
  const q=norm(S.gq||""); const tok=++gsTok;
  if(!q){ box.innerHTML=""; return; }
  if(q.length<2){ box.innerHTML=`<p class="pnote">Tape au moins 2 lettres.</p>`; return; }
  box.innerHTML=`<div class="spin"></div>`;
  const qn=q.replace(/^#|^n°?/,""); const isNum=/^\d+$/.test(qn);
  const match=(nom,k)=> isNum ? k===String(parseInt(qn,10)) : norm(nom).includes(q);
  const mine=[], others=[], packs=new Set();
  try{
    for(const s of mesSeries()){
      const cid=catOf(s), cards=await cardsOf(s.id); if(tok!==gsTok) return;
      const seen=new Set();
      if(cid) for(const x of catCards(cid).list){ seen.add(x.k); const c=withCat(cid,x.k,cards.get(x.k)); if(match(c.nom,x.k)){ mine.push({s,cid,c}); packs.add(cid); } }
      for(const [k,c] of cards){ if(seen.has(k)) continue; if(match(c.nom,k)) mine.push({s,cid,c}); }
    }
    if(!isNum && CAT){ const followed=new Set(S.series.map(s=>s.catalogue));
      for(const b of CAT.blocs) for(const id of b.sets){ if(followed.has(id)||(b.jeu||"pokemon")!==S.jeu) continue;
        for(const x of catCards(id).list){ if(norm(x.nom).includes(q)){ others.push({id,x}); if(others.length<=40) packs.add(id); } } } }
  }catch(e){ box.innerHTML=`<div class="err">${dbMsg(e)}</div>`; return; }
  mine.sort((a,b)=>qtot(b.c)-qtot(a.c));
  const draw=()=>{
    if(tok!==gsTok) return;
    let h=`<div class="sec-title"><h2>Dans mes séries</h2><span>${mine.length} carte${mine.length>1?"s":""} · ${mine.filter(m=>qtot(m.c)>0).length} possédée${mine.filter(m=>qtot(m.c)>0).length>1?"s":""}</span></div>`;
    h+= mine.length ? `<div class="cgrid">${mine.slice(0,150).map(({s,cid,c})=>{ const pr=cid?basePrice(cid,c):null;
      return `<div class="tcw ${qtot(c)>0?"own":""}"><button class="tcb" data-gs="${esc(s.id)}|${esc(c._id)}">${tileCard(c,s.total,cid,s.officiel||s.total)}</button>
      <div class="under"><span class="uname">${esc(s.nom)}</span>${pr?prLink(cid,c._id,eur(pr)+" ↗"):""}</div></div>`; }).join("")}</div>` : `<p class="pnote">Aucune carte de tes séries ne correspond.</p>`;
    if(others.length){ h+=`<div class="sec-title"><h2>Dans les autres séries</h2><span>${others.length>40?"40 premières sur "+others.length:others.length}</span></div>
      <div class="cgrid">${others.slice(0,40).map(({id,x})=>{ const st=CAT.sets[id]; const c=withCat(id,x.k,null); c.qte={normale:1}; const pr=x.p||x.ph;
      return `<div class="tcw"><button class="tcb" data-gx="${esc(id)}|${esc(x.k)}">${tileCard(c,st.c.length,id,st.off)}</button>
      <div class="under"><span class="uname">${esc(st.nom)}</span>${pr?prLink(id,x.k,eur(pr)+" ↗"):""}</div></div>`; }).join("")}</div>`; }
    box.innerHTML=h;
    box.querySelectorAll("[data-gs]").forEach(b=>b.onclick=()=>{ const [sid,k]=b.dataset.gs.split("|"); S.pendingCard=k; if(S.cur===sid){ sheetCard(k); } else location.hash="s-"+sid; });
    box.querySelectorAll("[data-gx]").forEach(b=>b.onclick=()=>{ const [id,k]=b.dataset.gx.split("|"); sheetAddFromSearch(id,k); });
  };
  draw();
  await Promise.all([...packs].slice(0,25).map(loadPack)); draw();
}

  const tot=boostTotal(b);
  openSheet(`<h3>${esc(b.nom||"Booster en cours")}</h3><div class="sub">${b.cartes.length} carte${b.cartes.length>1?"s":""} scannée${b.cartes.length>1?"s":""} · valeur <b style="color:var(--gold2)">${eur(tot)||"0,00 €"}</b></div>
    ${b.cartes.length?boostRows([...b.cartes].sort((x,y)=>(y.prix||0)-(x.prix||0))):`<p class="hint">Aucune carte scannée pour l'instant.</p>`}
    <label class="fld"><span>Prix payé pour ce booster (facultatif)</span><input id="boPaye" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ex. 5,50"></label>
    <div id="boGain"></div>
    <button class="btn pri" id="boSave">Terminer et enregistrer</button>
    <button class="btn sec" id="boMore">${IC.cam} Scanner une autre carte</button>
    <button class="btn dng" id="boCancel">Abandonner ce booster</button>
    <p class="hint">Abandonner ne retire pas les cartes de ta collection, seulement le suivi du booster.</p>`, sh=>{
    const inp=$("#boPaye",sh);
    inp.oninput=()=>{ const p=parseFloat(inp.value.replace(",",".")); $("#boGain",sh).innerHTML = isNaN(p)?"" : `<div class="${tot-p>=0?"gain up":"gain down"}">${tot-p>=0?"Gain":"Perte"} : ${eur(Math.abs(tot-p))}</div>`; };
    $("#boMore",sh).onclick=()=>{ closeSheet(); startScan(); };
    const end=async keep=>{
      const chain=b.chainAvant; 
      try{
        if(keep){ const p=parseFloat(inp.value.replace(",",".")); await db.doc("boosters/"+uid()).set({date:b.debut||Date.now(),fin:Date.now(),nom:b.nom||"",cartes:b.cartes,total:Math.round(tot*100)/100,prixPaye:isNaN(p)?null:p}); }
        await db.doc("reglages/booster").set({actif:false});
        S.boost=null; S.chain=chain; closeSheet(); toast(keep?"Booster enregistré":"Booster abandonné"); render();
      }catch(e){ toast(dbMsg(e)); }
    };
    $("#boSave",sh).onclick=()=>end(true);
    const c=$("#boCancel",sh); c.onclick=()=>{ if(!c.dataset.ok){ c.dataset.ok=1; c.textContent="Confirmer l'abandon"; return; } end(false); };
  });
}
function sheetBoosterHistory(){
  const L=S.boosters;
  const tot=L.reduce((a,b)=>a+(b.total||0),0), paid=L.reduce((a,b)=>a+(b.prixPaye||0),0), anyPaid=L.some(b=>b.prixPaye!=null);
  openSheet(`<h3>Mes boosters</h3><div class="sub">${L.length} booster${L.length>1?"s":""} ouvert${L.length>1?"s":""} · valeur totale <b style="color:var(--gold2)">${eur(tot)||"0,00 €"}</b>${anyPaid?` · payé ${eur(paid)}`:""}</div>
    ${L.length?`<div class="catlist">${L.map(b=>{ const best=[...(b.cartes||[])].sort((x,y)=>(y.prix||0)-(x.prix||0))[0];

        <span class="go">${eur(b.total)||"0 €"}${g!=null?`<br><small style="color:${g>=0?"var(--ok)":"#ff8a8a"}">${g>=0?"+":"−"}${eur(Math.abs(g))}</small>`:""}</span></button>`; }).join("")}</div>`:`<div class="empty"><b>Aucun booster</b>Touche « Ouvrir un booster » sur l'accueil pour commencer.</div>`}
    <button class="btn pri" id="bhNew">${IC.pack} Ouvrir un booster</button>`, sh=>{

async function sheetBoosterDetail(b){
  if(!b) return; await Promise.all([...new Set((b.cartes||[]).map(c=>c.cid))].map(loadPack));

/* ============ Doubles d'une série ============ */
function sheetDoubles(){
  const s=curSerie(), cid=catOf(s), all=slots().filter(c=>qtot(c)>1);
  const rows=all.map(c=>{ const n=qtot(c); const vs=VARS.filter(v=>(c.qte[v.k]||0)>0);
    const prices=vs.map(v=>cid?unitPrice(cid,c._id,v.k)||0:0); const keep=Math.min(...prices);
    const spareVal=cid?Math.max(0,cardValue(cid,c)-keep):0;
    return {c,n,spare:n-1,spareVal,detail:vs.map(v=>`${c.qte[v.k]} ${v.l.toLowerCase()}`).join(", ")}; }).sort((a,b)=>b.spareVal-a.spareVal);
  const totN=rows.reduce((a,r)=>a+r.spare,0), totV=rows.reduce((a,r)=>a+r.spareVal,0);
  const offi=s.officiel||s.total;
  const txt=`Mes doubles – ${s.nom}\n`+rows.map(r=>`• ${r.c.nom||"Carte"} (${/^\d+$/.test(r.c._id)?pad(r.c._id,s.total)+"/"+offi:r.c._id}) : ${r.spare} en double${r.spareVal?" ≈ "+eur(r.spareVal):""}`).join("\n");
  openSheet(`<h3>Mes doubles</h3><div class="sub">${esc(s.nom)} · ${totN} carte${totN>1?"s":""} en trop${cid?` · valeur ≈ <b style="color:var(--gold2)">${eur(totV)}</b>`:""}</div>
    ${rows.length?`<div class="blist">${rows.map(r=>`<div class="brow" data-dc="${esc(r.c._id)}">${tileCard(r.c,s.total,cid,offi)}<div class="bi"><b>${esc(r.c.nom||"Carte")} · ${esc(pad(r.c._id,s.total))}</b><span>${r.n} exemplaires (${esc(r.detail)}) · <b>${r.spare} en double</b></span></div><div class="bp">${r.spareVal?prLink(cid,r.c._id,eur(r.spareVal),"cmk"):""}</div></div>`).join("")}</div>
    <button class="btn gold" id="dCopy">Copier la liste pour l'envoyer</button>`:`<div class="empty"><b>Aucun double</b>Tu n'as aucune carte en plusieurs exemplaires dans cette série.</div>`}
    <p class="hint">Le double compte tous les exemplaires sauf un ; la valeur garde de côté ton exemplaire le moins cher.</p>`, sh=>{
    sh.querySelectorAll("[data-dc]").forEach(r=>r.querySelector(".tc").onclick=()=>sheetCard(r.dataset.dc));
    const cp=$("#dCopy",sh); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); toast("Liste copiée : colle-la dans un message"); }
      catch(e){ cp.insertAdjacentHTML("afterend",`<textarea class="fld" style="width:100%;height:160px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px">${esc(txt)}</textarea>`); cp.remove(); } };
  });
}

/* ============ Sauvegarde ============ */
async function buildBackup(onStep){
  const out={app:"Ma Collection Pokémon",version:1,date:new Date().toISOString(),series:[],boosters:S.boosters,historique:S.hist};
  let i=0;
  for(const s of S.series){ const m=await cardsOf(s.id); const {id,...data}=s; const cartes={}; for(const [k,c] of m){ const {_id,...d}=c; cartes[k]=d; }
    out.series.push({id,data,cartes}); onStep&&onStep(++i,S.series.length); }
  return out;
}
const b64utf8 = str=>{ const b=new TextEncoder().encode(str); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
function backupName(){ return "ma-collection-pokemon-"+today()+".json"; }
function menuHome(){
  let mail=""; try{ mail=localStorage.getItem("mailSauvegarde")||""; }catch(e){}
  openSheet(`<h3>Options</h3><div class="sub">Ta collection est enregistrée en ligne sur ton compte Claude. Une sauvegarde te garde une copie de secours.</div><div class="menu">
    <button class="btn sec" id="oHist">${IC.list} Mes boosters</button>
    ${downloads?`<button class="btn sec" id="oDl">${IC.dl} Télécharger une sauvegarde</button>`:""}
    ${mcp?`<label class="fld"><span>Envoyer la sauvegarde à</span><input id="oMail" type="email" inputmode="email" placeholder="ton.adresse@gmail.com" value="${esc(mail)}"></label><button class="btn sec" id="oGm">${IC.mail} Envoyer la sauvegarde par Gmail</button>`:""}
    <button class="btn sec" id="oUp">${IC.up} Restaurer une sauvegarde</button></div>${bipBtn()}<div id="oMsg"></div>`, sh=>{
    bindBip(sh);
    const msg=(t,cls="warn")=>{ $("#oMsg",sh).innerHTML=`<div class="${cls}">${t}</div>`; };
    $("#oHist",sh).onclick=sheetBoosterHistory;
    const dl=$("#oDl",sh); if(dl) dl.onclick=async()=>{ dl.disabled=true; msg("Préparation de la sauvegarde…");
      try{ const data=JSON.stringify(await buildBackup()); await downloads.save({filename:backupName(),data:new Blob([data],{type:"application/json"})}); msg("Sauvegarde enregistrée sur ton appareil.","warn"); }
      catch(e){ msg(e&&e.code==="cancelled"||e&&e.code==="declined"?"Téléchargement annulé.":"Le téléchargement n'a pas pu se faire.","err"); }
      dl.disabled=false; };
    const gm=$("#oGm",sh); if(gm) gm.onclick=async()=>{
      const to=$("#oMail",sh).value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ msg("Indique une adresse e-mail valide.","err"); return; }
      try{ localStorage.setItem("mailSauvegarde",to); }catch(e){}
      gm.disabled=true; msg("Préparation et envoi…");
      try{
        const bk=await buildBackup(); const nCartes=bk.series.reduce((a,s)=>a+Object.values(s.cartes).filter(c=>qtot(c)>0).length,0);
        await mcp.callTool("Gmail","send_message",{to:[to],subject:"Sauvegarde Ma Collection Pokémon – "+new Date().toLocaleDateString("fr-FR"),
          body:`Sauvegarde de ta collection du ${new Date().toLocaleString("fr-FR")}.\n${bk.series.length} séries, ${nCartes} cartes différentes possédées.\n\nPour la restaurer : appli Ma Collection › menu ⋯ › Restaurer une sauvegarde, puis choisis le fichier joint.`,
          attachments:[{content:b64utf8(JSON.stringify(bk)),filename:backupName(),mimeType:"application/json"}]});
        msg("Sauvegarde envoyée à "+esc(to)+" ✓");
      }catch(e){ const c=e&&e.code;
        msg(c==="server_not_connected"?"Gmail n'est pas connecté : ajoute-le dans claude.ai › Paramètres › Connecteurs.":
            c==="needs_reauth"?"Gmail doit être reconnecté dans claude.ai › Paramètres › Connecteurs.":
            c==="not_in_manifest"||c==="approval_required"?"Il faut autoriser Gmail pour cette appli : réessaie et accepte la demande.":
            c==="not_granted"||c==="capability_disabled"?"L'envoi par Gmail n'est pas disponible ici.":
            "L'envoi n'a pas abouti"+(e&&e.message?" ("+esc(String(e.message).slice(0,120))+")":"")+". Vérifie ta boîte d'envoi avant de réessayer.","err"); }
      gm.disabled=false; };
    $("#oUp",sh).onclick=()=>restoreBackup(sh,msg);
  });
}
function restoreBackup(sh,msg){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json"; i.style.display="none"; document.body.appendChild(i);
  i.onchange=async()=>{ const f=i.files&&i.files[0]; i.remove(); if(!f) return;
    let bk; try{ bk=JSON.parse(await f.text()); if(!bk||!Array.isArray(bk.series)) throw 0; }catch(e){ msg("Ce fichier n'est pas une sauvegarde de l'appli.","err"); return; }
    const n=bk.series.reduce((a,s)=>a+Object.keys(s.cartes||{}).length,0);
    msg(`Sauvegarde du ${new Date(bk.date).toLocaleDateString("fr-FR")} : ${bk.series.length} séries, ${n} cartes enregistrées. Les cartes de la sauvegarde remplaceront celles de l'appli (les séries absentes de la sauvegarde ne sont pas touchées).<button class="btn pri" id="rsGo">Restaurer</button><div class="prog hidden" id="rsP"><i></i></div>`);
    $("#rsGo",sh).onclick=async()=>{ const b=$("#rsGo",sh); b.disabled=true; $("#rsP",sh).classList.remove("hidden");
      const ops=[]; for(const s of bk.series){ ops.push(["series/"+s.id,s.data]); for(const [k,c] of Object.entries(s.cartes||{})) ops.push([`series/${s.id}/cartes/${k}`,c]); }
      for(const bo of (bk.boosters||[])){ const {id,...d}=bo; if(id) ops.push(["boosters/"+id,d]); }
      for(const h of (bk.historique||[])){ const {id,...d}=h; if(id) ops.push(["historique/"+id,d]); }
      try{ await pool(ops,4,([p,d])=>db.doc(p).set(d),k=>{ $("#rsP i",sh).style.width=Math.round(k*100/ops.length)+"%"; });
        for(const k in ALL) delete ALL[k]; closeSheet(); toast("Sauvegarde restaurée"); render(); }
      catch(e){ b.disabled=false; b.textContent="Reprendre la restauration"; toast(dbMsg(e)); } };
  };
  i.click();
}

/* ============ Coût pour compléter une série ============ */
function missingOf(cid,all){ return all.filter(c=>qtot(c)<1).map(c=>{ const x=catCard(cid,c._id); const p=x?(x.p||x.ph||null):null; const pp=prixOf(cid,c._id); const v=pp?(pp[0]||pp[1]||null):p; return {c,v}; }); }
function missLine(cid,all){ const m=missingOf(cid,all); const tot=m.reduce((a,x)=>a+(x.v||0),0); return `Il te manque ${m.length} carte${m.length>1?"s":""} · ≈ ${eur(tot)} pour compléter`; }
function sheetMissing(){
  const s=curSerie(), cid=catOf(s); const m=missingOf(cid,slots()).sort((a,b)=>(a.v??1e9)-(b.v??1e9));
  const known=m.filter(x=>x.v), tot=known.reduce((a,x)=>a+x.v,0);
  let cum=0; const steps=[10,25,50,100,250,500,1000].map(b=>{ let n=0,c2=0; for(const x of known){ if(c2+x.v>b) break; c2+=x.v; n++; } return [b,n]; }).filter(([b,n],i,arr)=>n>0&&(i===0||n>arr[i-1][1]));
  openSheet(`<h3>Compléter ${esc(s.nom)}</h3><div class="sub">${m.length} carte${m.length>1?"s":""} manquante${m.length>1?"s":""} · environ <b style="color:var(--gold2)">${eur(tot)}</b>${m.length-known.length?` (${m.length-known.length} sans prix connu)`:""}</div>
    ${steps.length?`<div class="warn">Avec ${steps.slice(0,3).map(([b,n])=>`${eur(b).replace(",00","")} : ${n} carte${n>1?"s":""}`).join(" · ")}</div>`:""}
    <div class="blist">${m.map(({c,v})=>{ cum+=v||0; return `<div class="brow" data-mc="${esc(c._id)}">${tileCard(c,s.total,cid,s.officiel||s.total)}<div class="bi"><b>${esc(c.nom||"Carte")} · ${esc(pad(c._id,s.total))}</b><span>${esc(c.rarete||"")}${v?` · cumul ${eur(cum)}`:""}</span></div><div class="bp">${v?prLink(cid,c._id,eur(v),"cmk"):"—"}</div></div>`; }).join("")}</div>
    <p class="hint">Classées de la moins chère à la plus chère, au prix de la version la plus courante. Touche un prix pour voir les offres.</p>`, sh=>{
    sh.querySelectorAll("[data-mc]").forEach(r=>r.querySelector(".tc").onclick=()=>sheetCard(r.dataset.mc));
  });
}

/* ============ Top de ma collection ============ */
async function ownedAll(){
  const out=[];
  for(const s of mesSeries()){ const cid=catOf(s); if(!cid) continue; const cards=await cardsOf(s.id);
    for(const [k,c0] of cards){ const c=withCat(cid,k,c0); if(!c||qtot(c)<1) continue;
      const p=basePrice(cid,c)||0; const x=catCard(cid,k);
      const ref=(PRIX[cid]&&PRIX[cid].ref&&PRIX[cid].ref.p&&PRIX[cid].ref.p[k])||(x?[x.p,x.ph]:null);
      const own1=qtot(c)>0&&!(c.qte.normale>0);
      const old=ref?(own1?(ref[1]||ref[0]):(ref[0]||ref[1]))||0:0;
      out.push({s,cid,c,p,old,d:p&&old?p-old:0}); } }
  return out;
}
async function sheetTop(tab){
  openSheet(`<h3>Top de ma collection</h3><div class="spin"></div>`);
  let L; try{ L=await ownedAll(); }catch(e){ openSheet(`<h3>Top de ma collection</h3><div class="err">${dbMsg(e)}</div>`); return; }
  await Promise.all([...new Set(L.map(x=>x.cid))].map(loadPack));
  const refDate=()=>{ const r=Object.values(PRIX).map(d=>d&&d.ref&&d.ref.date).filter(Boolean).sort()[0]; const iso=r||(CAT&&CAT.prixMaj); try{ return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}); }catch(e){ return ""; } };
  const draw=t=>{
    let rows, sub;
    if(t==="cher"){ rows=[...L].sort((a,b)=>b.p-a.p).slice(0,10); sub="Tes 10 cartes les plus chères"; }
    else if(t==="up"){ rows=L.filter(x=>x.d>=0.05).sort((a,b)=>b.d-a.d).slice(0,10); sub="Plus fortes hausses depuis le "+refDate(); }
    else { rows=L.filter(x=>x.d<=-0.05).sort((a,b)=>a.d-b.d).slice(0,10); sub="Plus fortes baisses depuis le "+refDate(); }
    const tot=L.reduce((a,x)=>a+x.p,0);
    openSheet(`<h3>Top de ma collection</h3><div class="sub">${L.length} carte${L.length>1?"s":""} ${JEUX[S.jeu]} possédée${L.length>1?"s":""}</div>
      <div class="toptabs">${[["cher","Les plus chères"],["up","En hausse"],["down","En baisse"]].map(([k,l])=>`<button class="chip ${t===k?"on":""}" data-tt="${k}">${l}</button>`).join("")}</div>
      <p class="pnote" style="margin:0 0 6px">${sub}</p>
      ${rows.length?`<div class="blist">${rows.map((x,i)=>`<div class="brow" data-ts="${esc(x.s.id)}|${esc(x.c._id)}"><span class="un" style="font-family:'Exo 2';font-weight:800;color:var(--gold2);width:18px">${i+1}</span>${tileCard(x.c,x.s.total,x.cid,x.s.officiel||x.s.total)}<div class="bi"><b>${esc(x.c.nom||"Carte")}</b><span>${esc(x.s.nom)}${x.d&&t!=="cher"?"":""}</span>${t!=="cher"?`<span class="mv ${x.d>=0?"up":"down"}">${x.d>=0?"▲ +":"▼ −"}${eur(Math.abs(x.d))} (${x.old?((x.d*100/x.old)>=0?"+":"")+(x.d*100/x.old).toFixed(0)+" %":""})</span>`:""}</div><div class="bp">${x.p?prLink(x.cid,x.c._id,eur(x.p),"cmk"):"—"}</div></div>`).join("")}</div>`
        :`<div class="empty"><b>Rien pour l'instant</b>${t==="cher"?"Ajoute des cartes à ta collection.":"Les variations apparaîtront quand les prix auront bougé : reviens dans quelques jours."}</div>`}`, sh=>{
      sh.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>draw(b.dataset.tt));
      sh.querySelectorAll("[data-ts]").forEach(r=>r.querySelector(".tc").onclick=()=>{ const [sid,k]=r.dataset.ts.split("|"); closeSheet(); S.pendingCard=k; if(S.cur===sid) sheetCard(k); else location.hash="s-"+sid; });
    });
  };
  draw(tab);
}


/* ============ Holo : le reflet suit l'inclinaison ============ */
(function tilt(){ let bx=null,by=null,raf=0,tx=0,ty=0;
  const apply=()=>{ raf=0; const r=document.documentElement.style; r.setProperty("--tx",tx.toFixed(3)); r.setProperty("--ty",ty.toFixed(3)); r.setProperty("--tm",Math.min(1,Math.hypot(tx,ty)).toFixed(3)); };
  const on=e=>{ if(e.beta==null||e.gamma==null||RM.matches) return; if(bx==null){ bx=e.gamma; by=e.beta; }
    bx+=(e.gamma-bx)*.03; by+=(e.beta-by)*.03;   // la position de repos suit doucement : téléphone immobile = reflet immobile
    tx=Math.max(-1,Math.min(1,(e.gamma-bx)/22)); ty=Math.max(-1,Math.min(1,(e.beta-by)/22));
    if(!raf) raf=requestAnimationFrame(apply); };
  const start=()=>window.addEventListener("deviceorientation",on);
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==="function"){
    document.addEventListener("click",function ask(){ document.removeEventListener("click",ask); DeviceOrientationEvent.requestPermission().then(r=>{ if(r==="granted") start(); }).catch(()=>{}); });
  } else start();
})();
